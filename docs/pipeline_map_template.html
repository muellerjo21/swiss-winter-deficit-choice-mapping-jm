<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipeline-Karte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Generated by the rule pipeline_map (scripts/pipeline_map.py): arrows from `snakemake --rulegraph`, texts from
   docs/pipeline_map.yaml. Do not edit build/pipeline_map.html by hand. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --fg: #16202a; --muted: #54606c; --line: #d3d9df; --accent: #1f6fd1;
  --data: #2c8a5b; --attr: #1f6fd1; --util: #b9770e; --out: #1a8a96; --check: #5b6573; --edge: #8793a0; --ask: #d9531e;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #1a222b; --fg: #e6ebf0; --muted: #9aa6b2; --line: #2d3843;
    --accent: #6aa8f2; --data: #55c08a; --attr: #6aa8f2; --util: #e3a64b; --out: #4fc3cf;
    --check: #9aa6b2; --edge: #5f6b78; --ask: #f08a5d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #1a222b; --fg: #e6ebf0; --muted: #9aa6b2; --line: #2d3843;
  --accent: #6aa8f2; --data: #55c08a; --attr: #6aa8f2; --util: #e3a64b; --out: #4fc3cf;
  --check: #9aa6b2; --edge: #5f6b78; --ask: #f08a5d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); padding: 28px 16px 48px; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 26px; font-weight: 600; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 70ch; margin: 6px 0 0; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.toggles label { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer;
  padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.toggles input { accent-color: var(--accent); }
.toggles input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.graph { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
svg { display: block; min-width: 940px; width: 100%; height: auto; }
.node { cursor: pointer; }
.node rect { fill: var(--surface); stroke-width: 1.6; }
.node text { font-family: var(--mono); font-size: 11px; fill: var(--fg); pointer-events: none; }
.node:focus-visible rect { stroke-width: 3.2; }
.node:focus { outline: none; }
.node.sel rect { stroke-width: 3.2; fill: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.node.up rect, .node.down rect { fill: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.node.dim { opacity: 0.28; }
.node.gone { display: none; }
.node .ask { fill: var(--ask); }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.2; opacity: 0.55; }
.edge.on { stroke: var(--accent); stroke-width: 2; opacity: 1; }
.edge.dim { opacity: 0.1; }
.edge.gone { display: none; }
.layer-label { font-family: var(--font); font-size: 11px; fill: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px;
  display: grid; gap: 14px; min-height: 190px; }
.panel h2 { margin: 0; font-family: var(--mono); font-size: 19px; font-weight: 500; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tag { font-family: var(--font); font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; }
.panel p { margin: 0; font-size: 16px; line-height: 1.55; max-width: 75ch; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 28px; }
.cols div { min-width: 0; }
.cols h3 { margin: 0 0 4px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.cols ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.cols button { font-family: var(--mono); font-size: 12px; padding: 4px 8px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.cols button:hover { border-color: var(--accent); }
.cols button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cols .none { color: var(--muted); font-size: 14px; }
.ask-box { border-left: 3px solid var(--ask); padding: 8px 14px; background: color-mix(in srgb, var(--ask) 8%, var(--surface));
  font-size: 15px; line-height: 1.5; border-radius: 0 6px 6px 0; }
.ask-box b { color: var(--ask); font-weight: 600; }
.hint { color: var(--muted); font-size: 15px; }
@media (prefers-reduced-motion: no-preference) { .node, .edge { transition: opacity .15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pipeline-Karte</h1>
    <p class="sub">Die Snakemake-Pipeline des Semesterprojekts, von den Rohdaten bis zu den Abbildungen. Klicke auf einen Schritt, um zu sehen, was er macht und was davor und danach kommt.</p>
  </header>
  <div class="bar">
    <div class="legend" id="legend"></div>
    <div class="toggles">
      <label for="t-main"><input type="checkbox" id="t-main"> Nur regionale Hauptanalyse</label>
      <label for="t-ask"><input type="checkbox" id="t-ask"> Fragen an Tim zeigen</label>
    </div>
  </div>
  <div class="graph"><svg id="svg" role="group" aria-label="Pipeline-Graph"></svg></div>
  <section class="panel" id="panel" aria-live="polite"></section>
</div>

<script>
(function () {
  // {groups, layerLabels, startHint, nodes: [{id, g, layer, text, ask, nat}], edges: [[from, to]]}
  var DATA = /*PIPELINE_DATA*/;
  var GROUPS = {};
  Object.keys(DATA.groups).forEach(function (k) { GROUPS[k] = { name: DATA.groups[k], color: "var(--" + k + ")" }; });
  var N = DATA.nodes, E = DATA.edges;
  // Arrows into test and all are not drawn (too many); they still count for the highlighting.
  function hidden(e) { return e[1] === "test" || e[1] === "all"; }

  var NW = 178, NH = 38, GAP = 14, LH = 96, TOP = 46;
  var layers = {}, maxLayer = 0;
  N.forEach(function (n) { (layers[n.layer] = layers[n.layer] || []).push(n); maxLayer = Math.max(maxLayer, n.layer); });
  var widest = Math.max.apply(null, Object.keys(layers).map(function (k) { return layers[k].length * NW + (layers[k].length - 1) * GAP; }));
  var W = Math.max(1180, widest + 40);
  var byId = {};
  N.forEach(function (n) {
    var row = layers[n.layer], i = row.indexOf(n), total = row.length * NW + (row.length - 1) * GAP;
    n.x = (W - total) / 2 + i * (NW + GAP);
    n.y = TOP + n.layer * LH;
    byId[n.id] = n;
  });
  var H = TOP + maxLayer * LH + NH + 26;

  var up = {}, down = {};
  E.forEach(function (e) { (down[e[0]] = down[e[0]] || []).push(e[1]); (up[e[1]] = up[e[1]] || []).push(e[0]); });
  function reach(id, map) {
    var seen = {}, stack = [id];
    while (stack.length) { var c = stack.pop(); (map[c] || []).forEach(function (x) { if (!seen[x]) { seen[x] = 1; stack.push(x); } }); }
    return seen;
  }

  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (parent) parent.appendChild(e);
    return e;
  }

  DATA.layerLabels.forEach(function (t, i) {
    if (t && i <= maxLayer) { var tx = el("text", { x: 14, y: TOP + i * LH - 12, class: "layer-label" }, svg); tx.textContent = t; }
  });

  var edgeEls = [];
  E.forEach(function (e) {
    if (hidden(e)) return;
    var a = byId[e[0]], b = byId[e[1]];
    var x1 = a.x + NW / 2, y1 = a.y + NH, x2 = b.x + NW / 2, y2 = b.y, my = (y1 + y2) / 2;
    var p = el("path", { d: "M" + x1 + "," + y1 + " C" + x1 + "," + my + " " + x2 + "," + my + " " + x2 + "," + y2, class: "edge" }, svg);
    edgeEls.push({ el: p, from: e[0], to: e[1] });
  });

  function short(id) { return id.length > 24 ? id.slice(0, 22) + "…" : id; }
  var nodeEls = {};
  N.forEach(function (n) {
    var g = el("g", { class: "node", tabindex: "0", role: "button", "aria-label": n.id, transform: "translate(" + n.x + "," + n.y + ")" }, svg);
    el("rect", { width: NW, height: NH, rx: 7, stroke: GROUPS[n.g].color }, g);
    var t = el("text", { x: NW / 2, y: NH / 2 + 4, "text-anchor": "middle" }, g);
    t.textContent = short(n.id);
    if (n.ask) el("circle", { cx: NW - 8, cy: 8, r: 5, class: "ask", style: "display:none" }, g);
    g.addEventListener("click", function () { select(n.id); });
    g.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.id); } });
    nodeEls[n.id] = g;
  });

  var legend = document.getElementById("legend");
  Object.keys(GROUPS).forEach(function (k) {
    var s = document.createElement("span");
    s.innerHTML = '<i style="background:' + GROUPS[k].color + '"></i>' + GROUPS[k].name;
    legend.appendChild(s);
  });

  var tMain = document.getElementById("t-main"), tAsk = document.getElementById("t-ask");
  var current = null;

  function applyView() {
    N.forEach(function (n) {
      nodeEls[n.id].classList.toggle("gone", tMain.checked && !!n.nat);
      var dot = nodeEls[n.id].querySelector(".ask");
      if (dot) dot.style.display = tAsk.checked ? "" : "none";
    });
    edgeEls.forEach(function (e) { e.el.classList.toggle("gone", !!(tMain.checked && (byId[e.from].nat || byId[e.to].nat))); });
    if (current && tMain.checked && byId[current].nat) { current = null; }
    mark();
    render();
  }

  function mark() {
    var u = current ? reach(current, up) : {}, d = current ? reach(current, down) : {};
    N.forEach(function (n) {
      var g = nodeEls[n.id];
      g.classList.remove("sel", "up", "down", "dim");
      if (!current) return;
      if (n.id === current) g.classList.add("sel");
      else if (u[n.id]) g.classList.add("up");
      else if (d[n.id]) g.classList.add("down");
      else g.classList.add("dim");
    });
    edgeEls.forEach(function (e) {
      e.el.classList.remove("on", "dim");
      if (!current) return;
      var inUp = (e.to === current || u[e.to]) && !!u[e.from];
      var inDown = (e.from === current || d[e.from]) && !!d[e.to];
      e.el.classList.add(inUp || inDown ? "on" : "dim");
    });
  }

  function listButtons(ids) {
    if (!ids.length) return '<span class="none">kein anderer Schritt, nur Rohdaten</span>';
    return "<ul>" + ids.map(function (i) { return '<li><button type="button" data-id="' + i + '">' + i + "</button></li>"; }).join("") + "</ul>";
  }

  function render() {
    var panel = document.getElementById("panel");
    if (!current) { panel.innerHTML = '<p class="hint">' + DATA.startHint + "</p>"; bind(panel); return; }
    var n = byId[current];
    var direct = function (map) { return (map[current] || []).filter(function (i) { return !(tMain.checked && byId[i].nat); }); };
    var parents = direct(up);
    var children = direct(down).filter(function (i) { return i !== "test" && i !== "all"; });
    var html = '<h2>' + n.id + '<span class="tag" style="color:' + GROUPS[n.g].color + '">' + GROUPS[n.g].name + "</span>" +
      (n.nat ? '<span class="tag" style="color:var(--muted)">nationales Aggregat, Anhang</span>' : "") + "</h2>";
    html += "<p>" + n.text + "</p>";
    if (n.ask) html += '<div class="ask-box"><b>Frage an Tim.</b> ' + n.ask + "</div>";
    if (current === "test" || current === "all") {
      html += '<p class="hint">Die Pfeile in <b>test</b> und <b>all</b> sind nicht gezeichnet. Markiert ist alles, wovon der Schritt abhängt.</p>';
    } else {
      html += '<div class="cols"><div><h3>Braucht</h3>' + listButtons(parents) + "</div><div><h3>Liefert an</h3>" + listButtons(children) + "</div></div>";
    }
    panel.innerHTML = html;
    bind(panel);
  }

  function bind(panel) {
    Array.prototype.forEach.call(panel.querySelectorAll("button[data-id]"), function (b) {
      b.addEventListener("click", function () { select(b.getAttribute("data-id")); });
    });
  }

  function select(id) { current = (current === id) ? null : id; mark(); render(); }

  tMain.addEventListener("change", applyView);
  tAsk.addEventListener("change", applyView);
  applyView();
})();
</script>
</body>
</html>
