<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipeline-Karte</title>
<style>
/* Generated by the rule pipeline_map (scripts/pipeline_map.py): graph = `snakemake --rulegraph` drawn by graphviz (as
   in `snakemake dag`), texts from docs/pipeline_map.yaml. Do not edit build/pipeline_map.html by hand. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --fg: #16202a; --muted: #54606c; --line: #d3d9df; --accent: #1f6fd1;
  --data: #2c8a5b; --attr: #1f6fd1; --util: #b9770e; --out: #1a8a96; --check: #5b6573; --edge: #8793a0; --open: #d9531e;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #1a222b; --fg: #e6ebf0; --muted: #9aa6b2; --line: #2d3843; --accent: #6aa8f2;
    --data: #55c08a; --attr: #6aa8f2; --util: #e3a64b; --out: #4fc3cf; --check: #9aa6b2; --edge: #5f6b78; --open: #f08a5d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #1a222b; --fg: #e6ebf0; --muted: #9aa6b2; --line: #2d3843; --accent: #6aa8f2;
  --data: #55c08a; --attr: #6aa8f2; --util: #e3a64b; --out: #4fc3cf; --check: #9aa6b2; --edge: #5f6b78; --open: #f08a5d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); padding: 28px 16px 48px; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 26px; font-weight: 600; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 70ch; margin: 6px 0 0; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--open); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.controls label, .controls button { display: inline-flex; align-items: center; gap: 8px; font: 14px var(--font); cursor: pointer;
  padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--fg); }
.controls button:hover { border-color: var(--accent); }
.controls button:disabled { opacity: 0.45; cursor: default; }
.controls input { accent-color: var(--accent); }
.controls input:focus-visible, .controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.graph { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 12px; }
#graph-svg { display: block; width: 100%; min-width: 900px; height: auto; }
#graph-svg > g > polygon:first-of-type { fill: transparent; stroke: none; }   /* graphviz white background */
#graph-svg .node { cursor: pointer; }
#graph-svg .node path, #graph-svg .node polygon { fill: var(--surface); stroke-width: 2; }
#graph-svg .node text { fill: var(--fg); font-family: var(--mono); }
#graph-svg .node[data-g="data"] path { stroke: var(--data); }
#graph-svg .node[data-g="attr"] path { stroke: var(--attr); }
#graph-svg .node[data-g="util"] path { stroke: var(--util); }
#graph-svg .node[data-g="out"] path { stroke: var(--out); }
#graph-svg .node[data-g="check"] path { stroke: var(--check); }
#graph-svg .node.sel path { stroke-width: 4; fill: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
#graph-svg .node.up path, #graph-svg .node.down path { fill: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
#graph-svg .node:focus { outline: none; }
#graph-svg .node:focus-visible path { stroke-width: 4; }
#graph-svg .edge path { stroke: var(--edge); stroke-width: 1.3; opacity: 0.7; }
#graph-svg .edge polygon { stroke: var(--edge); fill: var(--edge); opacity: 0.7; }
#graph-svg .edge.on path { stroke: var(--accent); stroke-width: 2.4; opacity: 1; }
#graph-svg .edge.on polygon { stroke: var(--accent); fill: var(--accent); opacity: 1; }
#graph-svg .dim { opacity: 0.18; }
#graph-svg .off { opacity: 0.12; pointer-events: none; }
#graph-svg .open-dot { fill: var(--open); display: none; }
body.show-open #graph-svg .open-dot { display: inline; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px;
  display: grid; gap: 14px; min-height: 190px; }
.panel h2 { margin: 0; font-family: var(--mono); font-size: 19px; font-weight: 500; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tag { font-family: var(--font); font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; }
.panel p { margin: 0; font-size: 16px; line-height: 1.55; max-width: 75ch; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 28px; }
.cols div { min-width: 0; }
.cols h3 { margin: 0 0 4px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.cols ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.cols button { font-family: var(--mono); font-size: 12px; padding: 4px 8px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.cols button:hover { border-color: var(--accent); }
.cols button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cols .none { color: var(--muted); font-size: 14px; }
.open-box { border-left: 3px solid var(--open); padding: 8px 14px; background: color-mix(in srgb, var(--open) 8%, var(--surface));
  font-size: 15px; line-height: 1.5; border-radius: 0 6px 6px 0; }
.open-box b { color: var(--open); font-weight: 600; }
.hint { color: var(--muted); font-size: 15px; }
@media (prefers-reduced-motion: no-preference) { #graph-svg .node, #graph-svg .edge { transition: opacity .15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pipeline-Karte</h1>
    <p class="sub">Die Snakemake-Pipeline des Semesterprojekts als Graph, wie in <code>snakemake dag</code>. Klicke auf einen Schritt, um zu sehen, was er macht und was davor und danach kommt.</p>
  </header>
  <div class="bar">
    <div class="legend" id="legend"></div>
    <div class="controls">
      <label for="t-main"><input type="checkbox" id="t-main"> Nur regionale Hauptanalyse</label>
      <label for="t-open"><input type="checkbox" id="t-open"> Offene Punkte zeigen</label>
      <button type="button" id="reset">Auswahl aufheben</button>
    </div>
  </div>
  <div class="graph" id="graph"><!--PIPELINE_SVG--></div>
  <section class="panel" id="panel" aria-live="polite"></section>
</div>

<script>
(function () {
  // {groups, startHint, ids: {graphviz id: rule}, nodes: {rule: {g, nat, text, open}}, edges: [[from, to]]}
  var DATA = /*PIPELINE_DATA*/;
  var svg = document.getElementById("graph-svg");
  var NS = "http://www.w3.org/2000/svg";

  var up = {}, down = {};
  DATA.edges.forEach(function (e) { (down[e[0]] = down[e[0]] || []).push(e[1]); (up[e[1]] = up[e[1]] || []).push(e[0]); });
  function reach(id, map) {
    var seen = {}, stack = [id];
    while (stack.length) { var c = stack.pop(); (map[c] || []).forEach(function (x) { if (!seen[x]) { seen[x] = 1; stack.push(x); } }); }
    return seen;
  }

  // graphviz nodes and edges: <g class="node"><title>id</title>, <g class="edge"><title>a->b</title>
  var nodeEls = {}, edgeEls = [];
  Array.prototype.forEach.call(svg.querySelectorAll("g.node"), function (g) {
    var rule = DATA.ids[g.querySelector("title").textContent.trim()];
    var n = DATA.nodes[rule];
    g.setAttribute("data-g", n.g);
    g.setAttribute("tabindex", "0");
    g.setAttribute("role", "button");
    g.setAttribute("aria-label", rule);
    g.querySelector("title").textContent = rule;
    if (n.open) {
      var b = g.getBBox(), c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", b.x + b.width - 4); c.setAttribute("cy", b.y + 4); c.setAttribute("r", 5);
      c.setAttribute("class", "open-dot");
      g.appendChild(c);
    }
    g.addEventListener("click", function (ev) { ev.stopPropagation(); select(rule); });
    g.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(rule); } });
    nodeEls[rule] = g;
  });
  Array.prototype.forEach.call(svg.querySelectorAll("g.edge"), function (g) {
    var ends = g.querySelector("title").textContent.split("->");
    edgeEls.push({ el: g, from: DATA.ids[ends[0].trim()], to: DATA.ids[ends[1].trim()] });
  });

  var legend = document.getElementById("legend");
  Object.keys(DATA.groups).forEach(function (k) {
    var s = document.createElement("span");
    s.innerHTML = '<i style="background:var(--' + k + ')"></i>' + DATA.groups[k];
    legend.appendChild(s);
  });
  var openLegend = document.createElement("span");
  openLegend.innerHTML = '<i class="dot"></i>Offener Punkt';
  openLegend.hidden = true;
  legend.appendChild(openLegend);

  var tMain = document.getElementById("t-main"), tOpen = document.getElementById("t-open");
  var reset = document.getElementById("reset");
  var current = null;
  function off(rule) { return tMain.checked && DATA.nodes[rule].nat; }

  function mark() {
    var u = current ? reach(current, up) : {}, d = current ? reach(current, down) : {};
    Object.keys(nodeEls).forEach(function (rule) {
      var g = nodeEls[rule];
      g.classList.remove("sel", "up", "down", "dim");
      g.classList.toggle("off", off(rule));
      if (!current || off(rule)) return;
      if (rule === current) g.classList.add("sel");
      else if (u[rule]) g.classList.add("up");
      else if (d[rule]) g.classList.add("down");
      else g.classList.add("dim");
    });
    edgeEls.forEach(function (e) {
      e.el.classList.remove("on", "dim");
      e.el.classList.toggle("off", off(e.from) || off(e.to));
      if (!current) return;
      var inUp = (e.to === current || u[e.to]) && !!u[e.from];
      var inDown = (e.from === current || d[e.from]) && !!d[e.to];
      e.el.classList.add(inUp || inDown ? "on" : "dim");
    });
    reset.disabled = !current && !tMain.checked && !tOpen.checked;
  }

  function listButtons(rules) {
    if (!rules.length) return '<span class="none">kein anderer Schritt, nur Rohdaten</span>';
    return "<ul>" + rules.map(function (r) { return '<li><button type="button" data-id="' + r + '">' + r + "</button></li>"; }).join("") + "</ul>";
  }

  function render() {
    var panel = document.getElementById("panel");
    if (!current) { panel.innerHTML = '<p class="hint">' + DATA.startHint + "</p>"; return; }
    var n = DATA.nodes[current];
    var direct = function (map) { return (map[current] || []).filter(function (r) { return !off(r); }).sort(); };
    var html = "<h2>" + current + '<span class="tag" style="color:var(--' + n.g + ')">' + DATA.groups[n.g] + "</span>" +
      (n.nat ? '<span class="tag" style="color:var(--muted)">nationales Aggregat, Anhang</span>' : "") + "</h2>";
    html += "<p>" + n.text + "</p>";
    if (n.open) html += '<div class="open-box"><b>Offener Punkt.</b> ' + n.open + "</div>";
    html += '<div class="cols"><div><h3>Braucht</h3>' + listButtons(direct(up)) + "</div><div><h3>Liefert an</h3>" +
      listButtons(direct(down)) + "</div></div>";
    panel.innerHTML = html;
    Array.prototype.forEach.call(panel.querySelectorAll("button[data-id]"), function (b) {
      b.addEventListener("click", function () { select(b.getAttribute("data-id")); });
    });
  }

  function select(rule) { current = (current === rule) ? null : rule; mark(); render(); }
  function clearAll() {
    current = null; tMain.checked = false; tOpen.checked = false;
    document.body.classList.remove("show-open"); openLegend.hidden = true;
    mark(); render();
  }

  tMain.addEventListener("change", function () { if (current && off(current)) current = null; mark(); render(); });
  tOpen.addEventListener("change", function () {
    document.body.classList.toggle("show-open", tOpen.checked); openLegend.hidden = !tOpen.checked; mark();
  });
  reset.addEventListener("click", clearAll);
  document.getElementById("graph").addEventListener("click", function () { if (current) select(current); });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") clearAll(); });
  mark(); render();
})();
</script>
</body>
</html>
