# Configuration of the Snakemake pipeline, the single source of all parameters (the code has no defaults of its own;
# a missing key stops with an error that names it). The scripts read it through the rules' params and through
# src/config.py, which gets the configuration of the run including its --config overrides from the Snakefile.

data:
    # Calliope results of Mellot et al. (2024) per weather year: data/raw/<weather_year>/ (copies of the Zenodo files;
    # the original download stays in data/raw/scenario_data/)
    scenario_dir: data/raw/{weather_year}
    canton_area: data/raw/flache_der_schweiz_nach_kantonen_in_quadratkilometern.csv
    # Choice model: name of an entry of choice_models (provenance, sizes and checksums: docs/data_provenance.md).
    # coefficients: Swiss coefficient group -> group/country of the model file; mobile_partworths: the file has the
    # mobile shift (utility.mobile_share > 0 is only possible then).
    choice_model: measured_2026_languages
    choice_models:
        # corrected model of the cleaned choice data (Tim Tröndle, 20 Nov 2026): European mean + effect per language
        # group; Switzerland as DE-CH and FR-CH (same respondents and choices as measured_2026); no mobile shift
        measured_2026_languages:
            file: data/raw/measured.nc
            coefficients: {DE-CH: DE-CH, FR-CH: FR-CH}
            mobile_partworths: false
        # cleaned choice data (Kristiina Joon, Climate Policy Lab, Nov 2026): European mean + country effect, one
        # Swiss coefficient set for all regions (no language split)
        measured_2026:
            file: data/raw/choice-model-measured/measured.nc
            coefficients: {DE-CH: Switzerland, FR-CH: Switzerland}
            mobile_partworths: false
        # previous model (Jan 2026): partworths per language group DE-CH / FR-CH, with the mobile shift
        jan_2026:
            file: data/raw/choice-model-jan-2026.nc
            coefficients: {DE-CH: DE-CH, FR-CH: FR-CH}
            mobile_partworths: true

# Weather year of the main analysis (Calliope runs with the weather of 2016, 2017 or 2018); the other years are
# compared in the sensitivity sensitivity.weather_years. 2016 = main result.
weather_year: 2016

price:
    # Base year for the ElCom reference price (yearly tariffs) and the EUR/CHF rate (annual mean of
    # the daily ECB rates). Must be a completed calendar year, otherwise the annual mean is not
    # reproducible.
    reference_year: 2025
    category: H4
    # ElCom tariff product of the reference prices (LINDAS, rules fetch_elcom_*)
    elcom_product: standard
    # Factor on the Calliope system cost C_s before the price formula (load_data.load_scenario_cost_and_demand),
    # in all analyses. 1.0 = costs as in the result files (main analysis). The currency year of C_s is not stated
    # in the result files; Mellot et al. take most costs in EUR 2015 (see sensitivity.cost_scale_conversions for the
    # conversion to 2025 prices as a sensitivity).
    cost_scale_factor: 1.0
    # Revenue margin mu of the price formula p_sim = C/D * e * 100 * (1 + mu) + tau + g, in all analyses and cost
    # scopes. 0.10 = margin assumed by Tröndle et al. (2025).
    margin: 0.10
    # Costs in the price formula, in all analyses: total = system cost of the whole Swiss energy system over the
    # electricity consumption (main analysis until Nov 2026); electricity = only the technologies of cost_groups.electricity (generation, electricity storage,
    # transmission); electricity_fuel = electricity plus the fuel costs of the power plants (fuel_power_techs) that
    # fall on electricity. The demand D_s stays the electricity consumption in these cases. With electricity the
    # costs of the fuels burnt in power plants (cost_groups.other) are missing. energy = all costs over the final
    # energy demand (electricity + heat + transport, load_data.load_scenario_final_energy) instead of D_s (main
    # analysis); then the reference price is energy_reference_ct_per_kwh, taxes/levies and grid usage are
    # energy_surcharge and VAT energy_vat is added. Otherwise taxes/levies and grid usage are the ElCom electricity values.
    cost_scope: energy
    # Reference price p_ref for cost_scope energy (CHF cents = Rp. per kWh of final energy), the same in every region;
    # null = the ElCom electricity reference. 16.94 = (a) national average 2025: final consumer expenditure for energy
    # 32.824 bn CHF (nominal, provisional; excl. aviation fuel) / final energy consumption excl. aviation fuel
    # 697'690 TJ = 193.80 TWh (777'870 - 80'180 TJ), BFE Schweizerische Gesamtenergiestatistik 2025, tables T42 and
    # T01 (https://pubdb.bfe.admin.ch/de/publication/download/7519, retrieved 4 Nov 2026). Carriers without expenditure
    # (ambient heat, solar heat, biogas, industrial waste) count with 0. Comparison (b) households 2025, electricity and
    # heat only: 15.82 Rp./kWh (T17a consumption; electricity 29.9 and gas 15.0 Rp./kWh from T37, heating oil, wood
    # and district heat at the T42/T01 averages); household mobility is not reported separately.
    energy_reference_ct_per_kwh: 16.94
    # Taxes/levies + grid usage tau + g for cost_scope energy: name of an entry of energy_surcharges (main analysis:
    # constant_2025; sensitivities: by_carrier_2025, electricity_only_2025).
    energy_surcharge: constant_2025
    # Entries: ct_per_kwh = one value in Rp. per kWh of final energy for every scenario (null = the ElCom electricity
    # values), or ct_per_kwh_by_carrier = today's rate per kWh of each end-use carrier (end_use_techs), applied to the
    # end-use consumption of each scenario and divided by its final energy. All values without VAT. Sources:
    # ElCom 2025 H4 national median tau + g 3.13 + 13.17 = 16.30 Rp./kWh (LINDAS, build/data/reference); mineral oil
    # tax MinöStG SR 641.61 Anhang 1 (state 1 Jan 2025: petrol 431.20, diesel 458.70, heating oil extra-light 3.00
    # Fr./1000 l, natural gas for heating 2.10 Fr./1000 kg) plus surcharge Art. 12 Abs. 2 (300 Fr./1000 l, motor
    # fuels); CO2 levy CO2-Verordnung SR 641.711 Art. 94 and Anhang 11 (state 1 May 2025, 120 Fr./t CO2: heating oil
    # extra-light 318.00 Fr./1000 l, natural gas 321.60 Fr./1000 kg); heating values and densities BAFU Faktenblatt
    # CO2-Emissionsfaktoren des THG-Inventars (Jan 2026), Tab. 1 and 2 (petrol 0.0426 TJ/t, 0.737 t/m3; diesel
    # 0.0430, 0.830; heating oil 0.0429, 0.839; natural gas 2025 0.0484 TJ/t); quantities BFE GEST 2025 T01 (retrieved
    # 15 Nov 2026 via the fedlex SPARQL endpoint and the publishers' downloads).
    energy_surcharges:
        # Today's taxes and levies over today's final energy mix: electricity tau + g 9'449 + mineral oil tax and
        # surcharge on petrol 2'046 and diesel 2'193 + heating oil (tax and CO2 levy) 690 + natural gas 631 =
        # 15'009 Mio. Fr. / 193.80 TWh final energy excl. aviation (GEST 2025 T01). Plausibility: petrol and diesel
        # within -2.7 and +0.2 % of the BAZG net revenue 2025 (table T 2.2, Q4: 2'102 and 2'188 Mio. Fr.); CO2 levy
        # gross 1'311 Mio. Fr. vs. "ungefähr 1.2 Mrd. Franken" per year (BAFU, exemptions not deducted); taxes =
        # 46 % of the final consumer expenditure 32.8 bn Fr. (GEST T42).
        constant_2025:
            ct_per_kwh: 7.74
        # Today's rates per kWh of the carrier: diesel 758.70 Fr./1000 l / 9.914 MWh/m3; natural gas (2.10 + 321.60)
        # Fr./t / 13.44 MWh/t; hydrogen has no tariff in the MinöStG; biofuels are assumed renewable (tax relief).
        by_carrier_2025:
            ct_per_kwh_by_carrier: {electricity: 16.30, gas: 2.41, diesel: 7.65, hydrogen: 0.0, biofuel: 0.0}
        # Previous estimate: ElCom tau + g of electricity (16.30 Rp./kWh) x electricity share of final energy (57.97 /
        # 193.80 TWh); without the taxes on fuels.
        electricity_only_2025:
            ct_per_kwh: 4.88
    # VAT on p_sim for cost_scope energy, because p_ref (GEST T42) includes it: the expenditure is valued with LIK
    # average prices "inkl. MwSt." and with PPI prices "korrigiert um die MwSt." (BFE, Methodik zur Schätzung der
    # Endverbraucherausgaben für Energie der GEST, July 2024, pp. 3-6, pubdb 11798; for electricity the level comes
    # from the electricity statistics, VAT not stated). 0.081 = standard rate, MWSTG SR 641.20 Art. 25 Abs. 1 (state
    # 31 Mar 2025); energy is not in the reduced-rate list (Abs. 2).
    energy_vat: 0.081
    # End-use technologies per carrier (Calliope carrier they consume) for by_carrier surcharges; conversion
    # technologies (power plants, electrolysis, DAC, storage) are not end use.
    end_use_techs:
        electricity: {carrier: electricity, techs: [demand_elec, hp, electrode_boiler, electric_heater, light_transport_ev,
                                                    heavy_transport_ev]}
        gas: {carrier: methane, techs: [buildings_methane_boiler, industry_methane_boiler]}
        diesel: {carrier: diesel, techs: [light_transport_ice, heavy_transport_ice]}
        hydrogen: {carrier: hydrogen, techs: [light_transport_fcev, heavy_transport_fcev]}
        biofuel: {carrier: biofuel, techs: [buildings_biofuel_boiler, industry_biofuel_boiler]}
    # Every Swiss technology with a cost in the result files belongs to exactly one group (checked when loading);
    # ac_transmission stands for all ac_transmission:<region> links.
    cost_groups:
        electricity: [roof_mounted_pv, open_field_pv, alpine_pv_subsidised, alpine_pv_not_subsidised, hydro_reservoir,
                      hydro_run_of_river, wind_onshore_monopoly, wind_onshore_competing, ccgt, ccgt_natgas, scgt_natgas,
                      scgt_renewable, chp_methane, chp_waste, chp_biofuel, pumped_hydro, battery,
                      hydrogen_electricity_storage, ac_transmission]
        other: [supply_biofuel, import_natgas, import_synmethane, import_syndiesel, import_hydrogen, biofuel_to_methane,
                biofuel_to_diesel, hydrogen_to_methane, hydrogen_to_liquids, electrolysis, hp, buildings_biofuel_boiler,
                buildings_methane_boiler, industry_methane_boiler, industry_biofuel_boiler, electrode_boiler,
                electric_heater, waste_boiler, hp_heat_storage_small, buildings_biofuel_boiler_heat_storage_small,
                buildings_methane_boiler_heat_storage_small, electric_heater_heat_storage_small,
                electrode_boiler_heat_storage_big, industry_biofuel_boiler_heat_storage_big,
                industry_methane_boiler_heat_storage_big, waste_boiler_heat_storage_big, hydrogen_storage, dac,
                daccs_local]
    # Power plants burning fuels whose costs are in cost_groups.other (reported in build/data/cost_groups.csv)
    fuel_power_techs: [ccgt, ccgt_natgas, scgt_natgas, scgt_renewable, chp_methane, chp_waste, chp_biofuel]
    # Fuel carriers priced for electricity_fuel (load_data.fuel_unit_costs): average model cost of the carrier = cost of
    # its producers plus their fuel inputs (these carriers) per GWh produced. Electricity and heat inputs (e.g. of
    # electrolysis) are not added, their costs are in the other cost groups. A carrier without producer costs 0.
    fuel_carriers: [natural_gas, methane, biofuel, hydrogen, co2, waste]
    # Fuel of the power plants allocated to electricity: output_share = electricity / all energy output of the plant
    # (CHP: the rest goes to heat; assumption), electricity = all fuel to electricity (upper bound)
    chp_fuel_allocation: output_share

land:
    # Definition of the attribute relative_land (share of land used by wind and open-field PV):
    # national_share = national land use (km², sum over all cantons) / national area (sum of the
    #                  canton areas from data.canton_area); main definition, like all other attributes
    #                  national. The survey attribute is a share of the country's land.
    # canton_mean    = unweighted mean over the cantons of land use / canton area (previous
    #                  definition, about twice the national share for most scenarios).
    definition: national_share

utility:
    # Share mobile_share (0..1) with which mobile_partworths (gamma) is added to beta_partworths:
    # u = sum_k z_k · (beta_k + mobile_share · gamma_k) / sigma_k, with raw attributes z and the
    # coefficients converted to real units by the survey scale sigma_k (see src/utility.py). In the model, m is a
    # 0/1 indicator per respondent (constant_data/m); "m=1 = answered on a mobile phone" is only
    # inferred from the variable name. 0.0 = reference case m=0 (previous results),
    # 1.0 = all m=1, 0.6184 = sample share of m=1 in DE-CH + FR-CH (478 of 773).
    mobile_share: 0.0
    # Credible interval of all posterior results (utility, pairwise probabilities, figures): probability mass
    # and type, as in Tröndle et al. (2025): 96 % HDI. interval_type: hdi (highest density interval =
    # shortest interval with this mass, as arviz.hdi) or equal_tailed ((1-p)/2 and 1-(1-p)/2 quantiles).
    # Column tag: hdi96 (utility_*_hdi96_low/high), eti94 for a 94 % equal-tailed interval; see src/intervals.py.
    credible_interval: 0.96
    interval_type: hdi

# Spatial resolution of the main analysis. regional (main): analysis on the 23 Calliope regions
# (20 cantons, AI_AR, BL_BS, NW_OW, TI) with their own land use, technology and ownership shares; price change and
# import share national (cost_scope energy: one reference price p_ref for all regions); utility with the coefficients
# of the region's coefficient group (regions.language mapped by data.choice_models.<entry>.coefficients; the measured
# model has one Swiss set) and population-weighted aggregation; results in files with the suffix _regional.
# national: only the national aggregate (attributes computed nationally, utility per coefficient group), which is
# always computed as secondary analysis (files without suffix, figures fig1-fig6). The regional outputs are part of
# the rule all only with resolution: regional (they can always be built explicitly and are part of the tests).
spatial:
    resolution: regional
    regional:
        # STATPOP permanent resident population on 31 Dec of this (completed) year, BFS PxWeb table
        population_year: 2024
        statpop_table: px-x-0102010000_101
        # Ticino (TI, a Calliope region of its own), for which the choice model has no coefficients (Italian-
        # speaking): de / fr / mixed = TI included with the DE-CH, FR-CH or mixed coefficients (mixed = draw-wise
        # LANGUAGE_REGION_WEIGHTS mix); TI counts towards Switzerland (national) only, not to DE-CH or FR-CH.
        # exclude = TI left out, the population weights of the other regions renormalised (main analysis until
        # Nov 2026).
        ticino: de
        # Sensitivity: TI with each of these coefficients, all regions included
        excluded_region_coefficients: [DE-CH, FR-CH, mixed]
        # Municipalities without a canton in the LINDAS register (BFS number: canton in the price year);
        # Moutier moved from BE to JU on 1 Jan 2026.
        municipality_canton_overrides: {700: BE}
        # Reference-price sweep: common additive shift of all regional reference prices (Rp./kWh)
        reference_price_shift:
            start: -9.0
            stop: 6.0
            step: 0.25

# Sensitivity of the ranking of the national aggregate to the reference price of the price formula (cost_scope energy:
# price.energy_reference_ct_per_kwh; otherwise the ElCom price), rule sensitivity_reference_price, fig6 national.
sensitivity:
    # Curve: only total_rp_kwh varies (Rp./kWh); taxes/levies, grid usage and EUR/CHF rate stay at
    # price.reference_year. The reference year's own total is added to the grid.
    # Range covers the ElCom electricity price (28.97 Rp./kWh in 2025) and the energy reference price (16.94).
    reference_price:
        start: 10.0
        stop: 35.0
        step: 0.25
    # Real base years with their own ElCom reference values and annual EUR/CHF rate. Must be
    # completed calendar years.
    base_years: [2022, 2023, 2024, 2025]
    # Pair whose rank swap is located (posterior-mean utility equal), by bisection to this tolerance
    # (Rp./kWh); the ranks are checked crossing_check_delta below and above the crossing point.
    # The changes of the rank-1 scenario over the range (rank1_switches, marked in fig6) use the
    # same tolerance and check distance.
    crossing_scenarios: [policy_alpine_pv, policy_sccgt_daccs]
    crossing_tolerance: 1.0e-10
    crossing_check_delta: 0.01
    # Regional main analysis with the system cost C_s multiplied by these factors (rule cost_scale_regional;
    # factors on the costs of the result files, independent of price.cost_scale_factor). The changes of the
    # rank-1 scenario are searched on the grid cost_scale_search and located with crossing_tolerance and
    # crossing_check_delta. Entries are numbers or names of cost_scale_conversions.
    cost_scale_factors: [1.0, 1.1, 1.2, 1.3, eur2015_to_2025_hicp_ea, eur2015_to_2025_chf_lik]
    # Price-year conversions of C_s from EUR 2015 to 2025 (Mellot et al. 2024 take most costs from the Danish Energy
    # Agency, via Pickering et al. 2022, Supplement Table S3: EUR 2015), as factor on C_s relative to the pipeline,
    # which converts C_s with the EUR/CHF rate e of price.reference_year:
    #   hicp     index_to / index_from
    #   chf_lik  to CHF 2015 with eur_chf_from, then the Swiss CPI (LIK) to 2025: eur_chf_from * lik_to / lik_from / e
    cost_scale_conversions:
        eur2015_to_2025_hicp_ea:
            method: hicp
            # Eurostat prc_hicp_aind, CP00, EA, annual average index (2015 = 100), 2015 and 2025; retrieved 3 Nov 2026
            index_from: 100.0
            index_to: 128.75
        eur2015_to_2025_chf_lik:
            method: chf_lik
            # ECB EXR.A.CHF.EUR.SP00.A, annual average 2015 (CHF per EUR); retrieved 3 Nov 2026
            eur_chf_from: 1.06785703125
            # BFS LIK cc-d-05.02.08 (sheet Index_y), annual averages 2015 and 2025 on the base December 2010 = 100
            # (the latest base with the 2015 average); release 3 Nov 2026, retrieved 3 Nov 2026
            lik_from: 97.9
            lik_to: 105.4
    # Weather years compared (rule weather_year_rankings): every scenario with a result file for the year; the
    # comparison over all years uses the scenarios available in all of them.
    weather_years: [2016, 2017, 2018]
    cost_scale_search:
        start: 0.5
        stop: 2.0
        step: 0.01

# Import attribute of the regional main analysis (src/load_data.import_quantities). Annual sums at the Swiss
# locations, divided by imports.denominator, clipped to [0, 1]:
#   electricity               net electricity import from abroad (as in the survey; main analysis until Nov 2026)
#   electricity_fuels         + imports of natural gas, hydrogen and synthetic methane (fuel_techs)
#   electricity_fuels_diesel  + imports of synthetic diesel (diesel_techs; main analysis)
# Assumption of the fuel variants: fuels are counted with their energy content, 1 GWh fuel = 1 GWh electricity
# (no conversion efficiency). The fuel variants are always computed as regional sensitivities.
imports:
    definition: electricity_fuels_diesel
    # Denominator of the import shares: electricity = electricity consumption (demand_elec + sector coupling; main
    # analysis until Nov 2026); final_energy = final energy demand (electricity + heat + transport, as for
    # price.cost_scope energy; main analysis)
    denominator: final_energy
    # Calliope import technology -> carrier it produces (carrier_prod at the Swiss locations)
    fuel_techs: {import_natgas: natural_gas, import_hydrogen: hydrogen, import_synmethane: methane}
    diesel_techs: {import_syndiesel: diesel}

# All figures (src/make_graphics.py, src/maps.py)
figures:
    # Scenario order of all figures (first = top/left; fig1/fig4 place scenarios by rank). null: by cost change
    # (Mellot et al. 2024, Table 3) ascending, cheapest first, scenarios without cost value last; or an explicit
    # list of all scenario ids.
    scenario_order: null
    # Scenarios with their own colour in every figure, in this order blue, orange, green, violet (at most 4; the
    # lines of fig6); all other scenarios grey.
    highlight_scenarios: [policy_alpine_pv, policy_sccgt_daccs, policy_mix, policy_remix]
    # Names of the scenarios in figures and texts, following Mellot et al. (2024), Table 3
    display_names:
        policy_mix: "MIX"
        policy_sccgt_daccs: "S/CCGT (Fossil) + DACCS"
        policy_remix: "RE MIX"
        policy_sccgt_plus_h2: "S/CCGT (Ren. Methane) + H2"
        policy_sccgt_no_h2: "S/CCGT (Ren. Methane)"
        policy_alpine_pv: "Alpine PV"
        baseline_no_self_sufficiency_result_4H: "EP2050+"
        policy_wind_x2: "Wind"
        policy_h2_imports_only: "H2 Imports"
        policy_chp: "CHP"
        policy_roof_pv: "Roof PV++"
        baseline: "EP2050+ (5 TWh constraint)"

# Pairwise choice probabilities of the regional main analysis (as in Tröndle et al. 2025, Fig. 1-4): per draw and
# region p = logistic(u_1 - u_2), aggregated as the population-weighted mean of the regional probabilities.
pairwise:
    # Scenario order of the matrix (fig9): figures.scenario_order.
    # Decimals of the percentages in the matrix cells
    decimals: 1
    # Pairs (scenario 1, scenario 2) for the maps (fig10): Alpine PV vs. the cheapest scenario (MIX, -17.0 %)
    # and vs. S/CCGT (Fossil) + DACCS
    map_pairs:
        - [policy_alpine_pv, policy_mix]
        - [policy_alpine_pv, policy_sccgt_daccs]

# Maps: canton boundaries from swisstopo swissBOUNDARIES3D (open data, free use with source attribution
# "© swisstopo"), release 2025-01 (status 1 Jan 2025: Moutier still in BE, as in STATPOP 2024), GeoPackage in
# LV95. sha256 = checksum of the zip file (also listed in the swisstopo STAC API as multihash 1220<sha256>).
maps:
    boundaries:
        url: https://data.geo.admin.ch/ch.swisstopo.swissboundaries3d/swissboundaries3d_2025-01/swissboundaries3d_2025-01_2056_5728.gpkg.zip
        sha256: 3509d2e3e2993dd97e6a36e37192e0b4e77d0ef3ac42148c51af5a5fe15f99c5
        file: data/raw/swissboundaries3d_2025-01_2056_5728.gpkg.zip
        member: swissBOUNDARIES3D_1_5_LV95_LN02.gpkg
        layer: tlm_kantonsgebiet
    crs: EPSG:2056
    # Coverage simplification for the figures (m); shared borders stay identical. 0 = full resolution.
    simplify_tolerance_m: 100
    # Colour range of the maps in % (Tröndle et al. 2025: 0-100), and a narrowed variant that shows the regional
    # differences (values outside take the end colours); both are written (variant with suffix _range<lo>-<hi>).
    color_range: [0, 100]
    color_range_variant: [40, 60]
    # Language map (fig12, rules fetch_languages, fetch_language_areas, language_shares, language_map); figure only,
    # no input of the analysis. Sources: docs/data_provenance.md.
    languages:
        # BFS, structural survey: "Hauptsprachen nach Kanton" (table T40.02.01.08.07, order no.
        # su-d-40.02.01.08.07-2024), permanent resident population, several main languages per person possible;
        # fixed BFS asset, checksum verified
        url: https://dam-api.bfs.admin.ch/hub/api/dam/assets/36399520/master
        sha256: 07b84a188c5da639a190695d78f0df57adbe4f6f07d73e8d6ce63e6a9dd86d56
        file: data/raw/su-d-40.02.01.08.07-2024.xlsx
        year: 2024
        sheet: Kanton
        total_column: Total Bevölkerung
        # Start of the column label of each language in the BFS tables -> key used in the code and figure
        columns: {de: Deutsch, fr: Französisch, it: Italienisch, rm: Rätoromanisch, en: Englisch, other: Andere Sprachen}
        # Canton names of the table that are not the German name of regions.cantons
        canton_names: {TI: Ticino, VD: Vaud, NE: Neuchâtel, GE: Genève}
        # Each canton is coloured by the majority among these languages, the intensity by its share in share_range
        majority_of: [de, fr, it]
        share_range: [0.5, 1.0]
        names: {de: German, fr: French, it: Italian, rm: Romansh}
        # Officially bi- or trilingual cantons (cantonal constitutions); outlined in the map
        bilingual_cantons: [BE, FR, VS, GR]
        # Language of each coefficient group of regions.language (same colour in both maps)
        group_language: {DE-CH: de, FR-CH: fr}
    language_areas:
        # BFS Raumgliederungen, typology "Sprachgebiete 2020" (HR_SPRGEB2020) per municipality, status 1 Jan 2025
        # (as swissBOUNDARIES3D 2025-01); export of the BFS query tool (HTTP POST). The export is generated on
        # request and is not byte-stable, so its content is checked instead of a checksum (rule language_shares).
        url: https://www.agvchapp.bfs.admin.ch/de/typologies/results/xls?SnapshotDate=01.01.2025&SelectedTypologies%5B0%5D=HR_SPRGEB2020
        method: post
        file: data/raw/bfs_sprachgebiete_2020_gemeinden_2025-01-01.xlsx
        label: BFS language areas 2020
        status: 1 Jan 2025
        sheet: Daten
        # Column labels of the export (header row) for municipality number, canton and language area
        columns: {municipality: BFS Gde-nummer, canton: Kanton, area: Sprachgebiete}
        municipality_layer: tlm_hoheitsgebiet

# Conventions of the Calliope result files of Mellot et al. (2024), used to read them (src/load_data.py)
calliope:
    # Locations of the neighbouring countries in the model; all other locations are Swiss (FR is the canton of
    # Fribourg, FRA is France)
    foreign_locations: [AUT, DEU, FRA, ITA]
    # Cost class of the system cost (variable cost; the files state no currency, read as million EUR)
    cost_class: monetary
    # Names in the files: electricity carrier, exogenous electricity demand, prefix of all demand technologies, and
    # the transmission links (<location>::<transmission_tech>:<other location>)
    electricity_carrier: electricity
    demand_electricity_tech: demand_elec
    demand_tech_prefix: demand
    transmission_tech: ac_transmission
    # Final energy (price.cost_scope energy, imports.denominator final_energy, load_data.load_scenario_final_energy):
    # electricity = demand_elec; heat = these heat demands (delivered heat); transport = energy into the vehicles, i.e.
    # the technologies whose name contains transport_marker (the transport demand technologies themselves are no energy)
    heat_demand_techs: [demand_buildings_heat, demand_low_temp_process_heat, demand_medium_temp_process_heat,
                        demand_high_temp_process_heat]
    transport_marker: _transport_
    # Technologies with electricity as input (sector coupling) that count as electricity consumption besides
    # demand_elec (denominator of the electricity import share and of the electricity price variants). Storage
    # (pumped_hydro, hydrogen_electricity_storage, battery) deliberately excluded: it would be counted twice.
    sector_coupling_electricity_techs: [light_transport_ev, heavy_transport_ev, hp, electrode_boiler, electrolysis, dac,
                                        daccs_local]

# Regions of the Calliope model (20 cantons, AI_AR, BL_BS, NW_OW, TI) and their languages (src/config.py)
regions:
    # BFS canton number (e.g. in swissBOUNDARIES3D) and German name (as in data.canton_area) of every canton
    cantons:
        ZH: {number: 1, name: "Zürich"}
        BE: {number: 2, name: "Bern"}
        LU: {number: 3, name: "Luzern"}
        UR: {number: 4, name: "Uri"}
        SZ: {number: 5, name: "Schwyz"}
        OW: {number: 6, name: "Obwalden"}
        NW: {number: 7, name: "Nidwalden"}
        GL: {number: 8, name: "Glarus"}
        ZG: {number: 9, name: "Zug"}
        FR: {number: 10, name: "Freiburg"}
        SO: {number: 11, name: "Solothurn"}
        BS: {number: 12, name: "Basel-Stadt"}
        BL: {number: 13, name: "Basel-Landschaft"}
        SH: {number: 14, name: "Schaffhausen"}
        AR: {number: 15, name: "Appenzell Ausserrhoden"}
        AI: {number: 16, name: "Appenzell Innerrhoden"}
        SG: {number: 17, name: "St. Gallen"}
        GR: {number: 18, name: "Graubünden"}
        AG: {number: 19, name: "Aargau"}
        TG: {number: 20, name: "Thurgau"}
        TI: {number: 21, name: "Tessin"}
        VD: {number: 22, name: "Waadt"}
        VS: {number: 23, name: "Wallis"}
        NE: {number: 24, name: "Neuenburg"}
        GE: {number: 25, name: "Genf"}
        JU: {number: 26, name: "Jura"}
    # Cantons merged into one location of the Calliope model
    merged_cantons: {AI_AR: [AI, AR], BL_BS: [BL, BS], NW_OW: [NW, OW]}
    # Language region of every location (coefficient group of the choice model and the groups DE-CH / FR-CH); null =
    # no coefficients in the choice model (TI, Italian-speaking; see spatial.regional.ticino)
    language: {ZH: DE-CH, BE: DE-CH, LU: DE-CH, UR: DE-CH, SZ: DE-CH, GL: DE-CH, ZG: DE-CH, SO: DE-CH, SH: DE-CH,
               SG: DE-CH, GR: DE-CH, AG: DE-CH, TG: DE-CH, FR: FR-CH, VD: FR-CH, VS: FR-CH, NE: FR-CH, GE: FR-CH,
               JU: FR-CH, AI_AR: DE-CH, BL_BS: DE-CH, NW_OW: DE-CH, TI: null}
    # Weights of the language regions (national aggregate, TI with mixed coefficients), normalised to sum 1: main
    # languages of the permanent resident population in %, German 61, French 23 (multiple answers possible; Italian
    # and Romansh left out as in language), BFS "Sprachliche Praktiken in der Schweiz", structural survey 2023,
    # https://dam-api.bfs.admin.ch/hub/api/dam/assets/34788128/master
    language_shares: {DE-CH: 61, FR-CH: 23}

# Mapping of the Calliope results to the attributes of the choice model (src/load_data.py)
attributes:
    # Change of the transmission capacity: 0 in all scenarios (the cross-border AC capacity is 13.249 GW per direction
    # in all 12 scenarios; Mellot et al. do not expand transmission). The mapping therefore carries no information on
    # grid expansion.
    transmission_change: 0.0
    # Capacity density (GW/km²) of the technologies that occupy land, as in Tröndle et al. (2025): 8 MW/km² wind,
    # 80 MW/km² PV (all PV and wind subtypes); rooftop PV occupies no additional land
    capacity_density_gw_per_km2: {wind_onshore_monopoly: 0.008, wind_onshore_competing: 0.008, open_field_pv: 0.08,
                                  alpine_pv_subsidised: 0.08, alpine_pv_not_subsidised: 0.08}
    # PV technologies: implicit reference category (solar) of the source attributes, part of the capacity denominator
    pv_reference_techs: [roof_mounted_pv, open_field_pv, alpine_pv_subsidised, alpine_pv_not_subsidised]
    # Owner of every generating technology (assumption, not empirical); public = implicit reference category
    ownership:
        roof_mounted_pv: commercial
        open_field_pv: commercial
        alpine_pv_subsidised: commercial
        alpine_pv_not_subsidised: commercial
        wind_onshore_monopoly: community
        wind_onshore_competing: community
        ccgt: commercial
        ccgt_natgas: commercial
        scgt_natgas: commercial
        scgt_renewable: commercial
        chp_methane: commercial
        chp_waste: commercial
        chp_biofuel: commercial
        hydro_run_of_river: public
        hydro_reservoir: public
        pumped_hydro: public
        nuclear: public
    # Source category of the choice model per technology; PV (pv_reference_techs) is the reference, coal and nuclear
    # have no Swiss technology (share 0); hydropower has no category (capacities frozen by Mellot et al.)
    source:
        wind_onshore_monopoly: source_wind
        wind_onshore_competing: source_wind
        ccgt: source_gas
        ccgt_natgas: source_gas
        scgt_natgas: source_gas
        scgt_renewable: source_gas
        chp_methane: source_gas
        chp_biofuel: source_biomass
        chp_waste: source_biomass
    # Electricity-producing technologies deliberately without an assignment; every other electricity producer must be
    # mapped (src/checks.py stops the workflow otherwise). Storage releases stored electricity and owns no generation.
    ownership_excluded: [battery, hydrogen_electricity_storage]
    source_excluded: [battery, hydrogen_electricity_storage, hydro_reservoir, hydro_run_of_river, pumped_hydro]

# Swiss cost change of the scenarios relative to EP2050+ in %, Mellot et al. (2024), Energy Conversion and Management
# 309, 118426, Table 3; comparison with the preference ranking, not a choice-model attribute. baseline (EP2050+ with
# the 5 TWh winter constraint) is not in Table 3 (.nan).
mellot_cost_change_pct:
    policy_mix: -17.0
    policy_sccgt_daccs: -16.3
    policy_remix: -8.8
    policy_sccgt_plus_h2: -3.6
    policy_sccgt_no_h2: -3.6
    policy_alpine_pv: -0.8
    baseline_no_self_sufficiency_result_4H: 0.0
    policy_wind_x2: 18.0
    policy_h2_imports_only: 19.2
    policy_chp: 22.2
    policy_roof_pv: 33.7
    baseline: .nan

# Download endpoints of the fetch rules (src/load_data.py). Changing them does not re-run the downloads; re-fetch on
# purpose with --forcerun <rule>.
sources:
    lindas_sparql: https://lindas.admin.ch/query
    statpop_pxweb: "https://www.pxweb.bfs.admin.ch/api/v1/de/{table}/{table}.px"
    eur_chf_rates: "https://api.frankfurter.dev/v1/{year}-01-01..{year}-12-31"

# Scenario ID (wildcard) -> .nc file name in data.scenario_dir. Explicit mapping instead of a glob,
# because the file names contain commas.
scenarios:
    # scenario ID -> {weather year: result file in data.scenario_dir, or null if Mellot et al. did not publish that
    # run; missing runs are skipped with a message}. Baseline (5 TWh) vs. EP2050+ decided by content, not by the file
    # names: the winter (Oct-Mar) net electricity import is 5.0 TWh only in the 2016 baseline; all files ending in
    # _no_self_sufficiency have 9.0 TWh, i.e. EP2050+ without the 5 TWh limit (checked 17 Nov 2026 with Mellot's
    # control files, docs/data_provenance.md). There are no 5 TWh runs for 2017 and 2018. EP2050+ uses the runs
    # without fixed neighbours as in 2016 (2017: control file of the Zenodo Sandbox preview).
    baseline:
        2016: "barrier_baseline,neighbours_fixed_by_EP2050_baseline_2016_result_4H.nc"
        2017: null
        2018: null
