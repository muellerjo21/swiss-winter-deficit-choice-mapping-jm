# Configuration of the Snakemake pipeline. The "price" section is the single source for the
# price parameters: src/config.py reads PRICE_REFERENCE_YEAR and PRICE_CATEGORY from here, so that
# notebooks and interactive runs use the same values. reference_year is the base year of both the
# ElCom reference price and the EUR/CHF rate (annual mean of the daily ECB rates of that year).

data:
    scenario_dir: data/raw/scenario_data
    canton_area: data/raw/flache_der_schweiz_nach_kantonen_in_quadratkilometern.csv
    choice_model: data/raw/choice-model-jan-2026.nc

price:
    # Base year for the ElCom reference price (yearly tariffs) and the EUR/CHF rate (annual mean of
    # the daily ECB rates). Must be a completed calendar year, otherwise the annual mean is not
    # reproducible.
    reference_year: 2025
    category: H4

land:
    # Definition of the attribute relative_land (share of land used by wind and open-field PV):
    # national_share = national land use (km², sum over all cantons) / national area (sum of the
    #                  canton areas from data.canton_area); main definition, like all other attributes
    #                  national. The survey attribute is a share of the country's land.
    # canton_mean    = unweighted mean over the cantons of land use / canton area (previous
    #                  definition, about twice the national share for most scenarios).
    definition: national_share

utility:
    # Share mobile_share (0..1) with which mobile_partworths (gamma) is added to beta_partworths:
    # u = sum_k z_k · (beta_k + mobile_share · gamma_k) / sigma_k, with raw attributes z and the
    # coefficients converted to real units by the survey scale sigma_k (see src/utility.py). In the model, m is a
    # 0/1 indicator per respondent (constant_data/m); "m=1 = answered on a mobile phone" is only
    # inferred from the variable name. 0.0 = reference case m=0 (previous results),
    # 1.0 = all m=1, 0.6184 = sample share of m=1 in DE-CH + FR-CH (478 of 773).
    mobile_share: 0.0
    # Probability mass of the credible interval of utility (columns utility_*_ci94_low/high for 0.94).
    # Equal-tailed interval between the (1-p)/2 and 1-(1-p)/2 quantiles of the posterior samples,
    # not a highest-density interval (HDI).
    credible_interval: 0.94

# Spatial resolution of the main analysis. national: attributes computed nationally, utility per
# language region (current main results). regional: additionally the analysis on the 23 Calliope regions
# (20 cantons, AI_AR, BL_BS, NW_OW, TI) with their own land use, technology and ownership shares and
# ElCom reference price, utility with the coefficients of the region's language region and population-
# weighted aggregation; results in files with the suffix _regional. The regional outputs are part of the
# rule all only with resolution: regional (they can always be built explicitly).
spatial:
    resolution: national
    regional:
        # STATPOP permanent resident population on 31 Dec of this (completed) year, BFS PxWeb table
        population_year: 2024
        statpop_table: px-x-0102010000_101
        # Regions without coefficients of the choice model (TI: Italian-speaking) are excluded in the
        # main regional analysis; the population weights of the other regions are renormalised.
        exclude_regions: [TI]
        # Sensitivity: TI included with these coefficients (mixed = draw-wise LANGUAGE_REGION_WEIGHTS mix)
        excluded_region_coefficients: [DE-CH, FR-CH, mixed]
        # Municipalities without a canton in the LINDAS register (BFS number: canton in the price year);
        # Moutier moved from BE to JU on 1 Jan 2026.
        municipality_canton_overrides: {700: BE}
        # Reference-price sweep: common additive shift of all regional reference prices (Rp./kWh)
        reference_price_shift:
            start: -9.0
            stop: 6.0
            step: 0.25

# Sensitivity of the ranking to the ElCom reference price (rule sensitivity_reference_price, fig6).
sensitivity:
    # Curve: only total_rp_kwh varies (Rp./kWh); taxes/levies, grid usage and EUR/CHF rate stay at
    # price.reference_year. The reference year's own total is added to the grid.
    reference_price:
        start: 20.0
        stop: 35.0
        step: 0.25
    # Real base years with their own ElCom reference values and annual EUR/CHF rate. Must be
    # completed calendar years.
    base_years: [2022, 2023, 2024, 2025]
    # Pair whose rank swap is located (posterior-mean utility equal), by bisection to this tolerance
    # (Rp./kWh); the ranks are checked crossing_check_delta below and above the crossing point.
    # The changes of the rank-1 scenario over the range (rank1_switches, marked in fig6) use the
    # same tolerance and check distance.
    crossing_scenarios: [policy_alpine_pv, policy_sccgt_daccs]
    crossing_tolerance: 1.0e-10
    crossing_check_delta: 0.01
    # Scenarios shown in fig6 (colour order of the palette)
    figure_scenarios: [policy_alpine_pv, policy_sccgt_daccs, policy_mix, policy_remix]

# Scenario ID (wildcard) -> .nc file name in data.scenario_dir. Explicit mapping instead of a glob,
# because the file names contain commas.
scenarios:
    baseline: "barrier_baseline,neighbours_fixed_by_EP2050_baseline_2016_result_4H.nc"
    baseline_no_self_sufficiency_result_4H: "barrier_baseline_no_self_sufficiency_result_4H.nc"
    policy_alpine_pv: "barrier_policy_alpine_pv,neighbours_fixed_by_EP2050_baseline_2016_result_4H.nc"
    policy_chp: "barrier_policy_chp,neighbours_fixed_by_EP2050_baseline_2016_result_4H.nc"
    policy_h2_imports_only: "barrier_policy_h2_imports_only,neighbours_fixed_by_EP2050_baseline_2016_result_4H.nc"
    policy_mix: "barrier_policy_mix,neighbours_fixed_by_EP2050_baseline_2016_result_4H.nc"
    policy_remix: "barrier_policy_remix,neighbours_fixed_by_EP2050_baseline_2016_result_4H.nc"
    policy_roof_pv: "barrier_policy_roof_pv,neighbours_fixed_by_EP2050_baseline_2016_result_4H.nc"
    policy_sccgt_daccs: "barrier_policy_sccgt_daccs,neighbours_fixed_by_EP2050_baseline_2016_result_4H.nc"
    policy_sccgt_no_h2: "barrier_policy_sccgt_no_h2,neighbours_fixed_by_EP2050_baseline_2016_result_4H.nc"
    policy_sccgt_plus_h2: "barrier_policy_sccgt_plus_h2,neighbours_fixed_by_EP2050_baseline_2016_result_4H.nc"
    policy_wind_x2: "barrier_policy_wind_x2,neighbours_fixed_by_EP2050_baseline_2016_result_4H.nc"

# Frozen, validated reference results for the rule "test"
reference:
    attributes: data/processed/scenario_attributes_summary.csv
    rankings: data/processed/utility_rankings.csv
    sensitivity_curve: data/processed/reference_price_curve.csv
    sensitivity_crossings: data/processed/reference_price_crossing_points.csv
    sensitivity_base_years: data/processed/reference_price_base_years.csv
    sensitivity_switches: data/processed/reference_price_rank1_switches.csv
    figure_sensitivity: graphics/fig6_p_rank1_vs_reference_price
    # Regional results (_regional) get frozen references only after they are approved.
