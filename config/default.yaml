# Reporting conventions (scripts/adjacent_pairs.py, docs/tie_groups.csv): neighbouring ranks are reported as tied if
# the higher-ranked scenario has the higher utility in fewer than tie_threshold of the posterior draws, or if their
# mean utilities differ by less than tie_utility_tolerance (practically identical scenarios). A convention of this
# project, not a statistical test.
report:
    tie_threshold: 0.95
    tie_utility_tolerance: 1.0e-5

